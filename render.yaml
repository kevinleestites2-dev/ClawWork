services:
  - type: web
    name: clawwork-dashboard
    env: python
    buildCommand: |
      pip install -r requirements.txt
      pip install uvicorn fastapi python-dotenv
      cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn livebench.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        value: AIzaSyAQsAPssodgLpinMSx-TFtpfpYpn7byfxs
      - key: OPENAI_API_KEY
        value: placeholder
      - key: OPENAI_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: EVALUATION_API_KEY
        value: AIzaSyAQsAPssodgLpinMSx-TFtpfpYpn7byfxs
      - key: EVALUATION_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: CLAWWORK_CONFIG
        value: livebench/configs/pantheon_gemini_free.json
      - key: CODE_SANDBOX_PROVIDER
        value: none
